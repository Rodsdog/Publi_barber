<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavalheiros S/A - Dashboard TV</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="img/logo.png" alt="Cavalheiros S/A">
        </div>
        <div class="header-info">
            <div class="info-item"><span class="label">Instagram</span>@cavalheirossabarbearia</div>
            <div class="info-item"><span class="label">WhatsApp</span>(11) 9 8096-9119</div>
            <div class="info-item"><span class="label">Horário</span>Seg-Sáb: 09h-20h | Dom: 09h-14h</div>
        </div>
    </header>

    <main>
        <section class="block">
            <h2 class="block-title">Tabela de Serviços</h2>
            <div id="container-servicos" class="grid-9-items">
                </div>
        </section>

        <section class="block">
            <h2 class="block-title">Produtos & Cuidados</h2>
            <div id="container-produtos-lista" class="grid-9-items">
                </div>
        </section>

        <section class="block vitrine-visual">
            <div class="track" id="track-vitrine">
                </div>
        </section>
    </main>

    <footer>
        <div class="qr-group">
            <div class="qr-item">
                <img src="img/qrcode/whatsapp.png" alt="WhatsApp">
                <span>WhatsApp</span>
            </div>
            <div class="qr-item">
                <img src="img/qrcode/instagram.png" alt="Instagram">
                <span>Instagram</span>
            </div>
            <div class="qr-item">
                <img src="img/qrcode/pix.png" alt="PIX">
                <span>PIX</span>
            </div>
            <div class="qr-item">
                <img src="img/qrcode/wifi.png" alt="Wi-Fi">
                <span>Wi-Fi</span>
            </div>
            <div class="qr-item">
                <img src="img/qrcode/avaliacao.png" alt="Avalie-nos">
                <span>Avalie-nos</span>
            </div>
        </div>
    </footer>
    <script src="js/scripts.js"></script>
</body>
</html>
